name: civic_horizon
description: "Mi Zamora - Servicios y participación ciudadana del GAD Municipal de Zamora"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Fonts
  google_fonts: ^6.2.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Networking
  dio: ^5.7.0
  url_launcher: ^6.3.1

  # Responsive
  responsive_framework: ^1.5.1

  # Local Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Image Picker
  image_picker: ^1.1.2

  # Permissions
  permission_handler: ^11.3.1

  # QR
  qr_flutter: ^4.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: any
  riverpod_generator: any
  json_serializable: any
  freezed: any
  freezed_annotation: any

  # Testing
  mocktail: any

  # Lints
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
